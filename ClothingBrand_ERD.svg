<!-- Relationship connectors -->
<path d="M410 300 H490 V300 H570" fill="none" stroke="#38bdf8" stroke-width="3"/>
<text x="490" y="285" fill="#7dd3fc" font-size="15" font-family="Arial" text-anchor="middle">1 : N</text>

<path d="M750 480 V610" fill="none" stroke="#a78bfa" stroke-width="3"/>
<text x="770" y="550" fill="#c4b5fd" font-size="15" font-family="Arial">1 : N</text>

<path d="M930 735 H1010 V695 H1090" fill="none" stroke="#34d399" stroke-width="3"/>
