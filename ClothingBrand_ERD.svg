<text x="750" y="930" fill="#94a3b8" font-size="15" font-family="Arial" text-anchor="middle">PK = Primary Key  |  FK = Foreign Key  |  1:N = One-to-Many</text>
<text x="750" y="960" fill="#64748b" font-size="13" font-family="Arial" text-anchor="middle">ClothingBrand Database • ERD Conceptual Visualization</text>
